[package]
name = "educraft"
version = "0.5.0"
description = "EDUcraft - Cross-Platform Desktop Application"
authors = ["EDUcraft Contributors"]
edition = "2021"

# Required for the lib.rs pattern (called from main.rs)
[lib]
name = "educraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
lopdf = { version = "0.44.0", default-features = false }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1
