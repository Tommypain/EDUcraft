[package]
name = "educraft"
version = "0.0.2"
description = "EDUcraft - Cross-Platform Desktop Application"
authors = ["EDUcraft Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
